schema: spec-driven

context: |
  Project: Sistema de Gestão Hospitalar.
  Domain: Sistema para gerenciar a jornada do paciente no hospital —
  cadastro de pacientes, médicos e convênios, registro de atendimentos e
  diagnósticos, controle de internações e leitos, e rastreamento de
  transferências.
  Tech stack:
    Reflex (Python full-stack) e banco relacional (SQLite em
    desenvolvimento, com possibilidade de migração para MySQL). Reflex é a
    tecnologia exclusiva do projeto: não há Flask, Jinja2 nem outro
    framework de frontend.
  Architecture:
    Backend responsável pelas regras de negócio e persistência via
    modelos Reflex (rx.Model). UI organizada em State (rx.State) e
    Components do Reflex. Não introduzir outra tecnologia de frontend ou
    backend sem uma mudança explícita da decisão arquitetural.
  Security:
    Validação de entradas e regras de autorização aplicadas no backend.
    Proteger dados sensíveis dos pacientes.
  Development:
    O projeto será desenvolvido incrementalmente utilizando OpenSpec.
    Mudanças relevantes devem ser especificadas antes da implementação.
    Seguir o ciclo Explore, Propose, Review, Apply e Archive.
  Language:
    Escrever a documentação do projeto e os artefatos OpenSpec em português
    brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo.
    - Identificar o que está fora do escopo quando necessário.
  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes.
  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.

operations:
  apply:
    guidance:
      - Executar verificações relevantes antes de concluir.
  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.
githubCopilot:
  cloudAgent: true
